name: CI

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install twine
          python -m pip install -U packaging
        # https://github.com/pypa/twine/issues/1216#issuecomment-2606531615

      - name: Create distributions
        run: python -m build

      - name: Test import
        run: |
          python -m pip install dist/*.whl
          python -c "import ximu3csv"

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Publish Python package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYTHON_TOKEN }}
        run: python -m twine upload --verbose --repository pypi dist/* --skip-existing
